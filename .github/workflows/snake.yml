name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 heures
  workflow_dispatch:          # lancement manuel
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer le snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#b36b00&color_dots=#ebedf0,#fde6b0,#fbc95b,#e39a00,#b36b00
            dist/github-snake-dark.svg?color_snake=#FFB000&color_dots=#16191f,#42330f,#73570f,#b88200,#ffb000

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
