<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="Distinctions : Licence en Mathématiques Pures et Appliquées, Génie Informatique ENSPY" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <!-- Carte 1 -->
    <rect x="1" y="5" width="438" height="120" rx="12" fill="#0b0e13" stroke="#2a2113"/>
    <polygon points="70,29 104,48 104,86 70,105 36,86 36,48" fill="#16120a" stroke="#FFB000" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <text x="70" y="78" font-size="30" font-weight="700" fill="#FFB000" text-anchor="middle">∑</text>
    <text x="128" y="55" font-size="12" fill="#8a8478" letter-spacing="2">DIPLÔME</text>
    <text x="128" y="78" font-size="17" font-weight="700" fill="#d6d3cc">Licence en Mathématiques</text>
    <text x="128" y="100" font-size="14" fill="#FFB000">Pures &amp; Appliquées</text>

    <!-- Carte 2 -->
    <rect x="461" y="5" width="438" height="120" rx="12" fill="#0b0e13" stroke="#2a2113"/>
    <polygon points="530,29 564,48 564,86 530,105 496,86 496,48" fill="#16120a" stroke="#FFB000" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <text x="530" y="76" font-size="20" font-weight="700" fill="#FFB000" text-anchor="middle">&lt;/&gt;</text>
    <text x="588" y="55" font-size="12" fill="#8a8478" letter-spacing="2">CYCLE INGÉNIEUR</text>
    <text x="588" y="78" font-size="17" font-weight="700" fill="#d6d3cc">Génie Informatique</text>
    <text x="588" y="100" font-size="14" fill="#FFB000">ENSPY · 5ᵉ année</text>
  </g>
</svg>