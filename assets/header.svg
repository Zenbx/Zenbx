<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Zenbx - ingénieur en formation, systèmes distribués, IoT, réseaux" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a2113"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="50%" r="55%">
      <stop offset="0" stop-color="#FFB000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFB000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="280" rx="14" fill="#0b0e13"/>
  <rect width="900" height="280" rx="14" fill="url(#dots)"/>
  <rect width="900" height="280" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="none" stroke="#2a2113"/>

  <!-- Texte -->
  <g font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="48" y="64" font-size="15" fill="#8a8478">$ whoami</text>
    <text x="48" y="150" font-size="72" font-weight="700" fill="#FFB000" textLength="236" lengthAdjust="spacing">ZENBX</text>
    <rect x="296" y="98" width="26" height="52" fill="#FFB000">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Sous-titres qui tournent -->
    <text x="48" y="198" font-size="20" fill="#d6d3cc" opacity="0"><tspan fill="#FFB000">&gt; </tspan>ingénieur en formation
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="15s" begin="0s" repeatCount="indefinite"/></text>
    <text x="48" y="198" font-size="20" fill="#d6d3cc" opacity="0"><tspan fill="#FFB000">&gt; </tspan>systèmes distribués &amp; devops
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="15s" begin="3s" repeatCount="indefinite"/></text>
    <text x="48" y="198" font-size="20" fill="#d6d3cc" opacity="0"><tspan fill="#FFB000">&gt; </tspan>iot · systèmes embarqués
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="15s" begin="6s" repeatCount="indefinite"/></text>
    <text x="48" y="198" font-size="20" fill="#d6d3cc" opacity="0"><tspan fill="#FFB000">&gt; </tspan>réseaux · communication
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="15s" begin="9s" repeatCount="indefinite"/></text>
    <text x="48" y="198" font-size="20" fill="#d6d3cc" opacity="0"><tspan fill="#FFB000">&gt; </tspan>web &amp; mobile
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.18;0.2;1" dur="15s" begin="12s" repeatCount="indefinite"/></text>

    <text x="48" y="234" font-size="14" fill="#8a8478">ENSPY · Yaoundé, Cameroun · 5ᵉ année</text>
    <circle cx="54" cy="256" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="68" y="260" font-size="13" fill="#4ade80">cluster : 5/5 nœuds actifs</text>
  </g>

  <!-- Réseau -->
  <g stroke="#4a3a1a" stroke-width="1.2" stroke-dasharray="4 6" fill="none">
    <path d="M570,80 L710,60"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M710,60 L830,120"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M570,80 L620,190"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M620,190 L770,205"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M710,60 L770,205"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M830,120 L770,205"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/></path>
  </g>

  <!-- Paquets -->
  <g fill="#FFB000">
    <circle r="3"><animateMotion dur="2.4s" repeatCount="indefinite" path="M570,80 L710,60"/></circle>
    <circle r="3"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M710,60 L830,120"/></circle>
    <circle r="3"><animateMotion dur="3.2s" begin="0.3s" repeatCount="indefinite" path="M620,190 L570,80"/></circle>
    <circle r="3"><animateMotion dur="2.6s" begin="1.1s" repeatCount="indefinite" path="M620,190 L770,205"/></circle>
    <circle r="3"><animateMotion dur="3s" begin="0.9s" repeatCount="indefinite" path="M770,205 L710,60"/></circle>
    <circle r="3"><animateMotion dur="2.2s" begin="0.2s" repeatCount="indefinite" path="M830,120 L770,205"/></circle>
  </g>

  <!-- Nœuds -->
  <g font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8a8478" text-anchor="middle">
    <circle cx="710" cy="60" r="7" fill="none" stroke="#FFB000">
      <animate attributeName="r" values="7;24" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g fill="#0b0e13" stroke="#FFB000" stroke-width="1.5">
      <circle cx="570" cy="80" r="7"/><circle cx="710" cy="60" r="7"/><circle cx="830" cy="120" r="7"/>
      <circle cx="620" cy="190" r="7"/><circle cx="770" cy="205" r="7"/>
    </g>
    <g fill="#FFB000"><circle cx="570" cy="80" r="2.5"/><circle cx="710" cy="60" r="2.5"/><circle cx="830" cy="120" r="2.5"/><circle cx="620" cy="190" r="2.5"/><circle cx="770" cy="205" r="2.5"/></g>
    <text x="570" y="64">web</text>
    <text x="710" y="42">réseau</text>
    <text x="830" y="104">iot</text>
    <text x="620" y="214">données</text>
    <text x="770" y="228">ci/cd</text>
  </g>
</svg>